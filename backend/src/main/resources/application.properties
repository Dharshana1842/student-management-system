spring.application.name=student-management-system

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_management}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
spring.web.resources.static-locations=file:./frontend/,classpath:/static/
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://localhost}
app.auth.admin.username=${ADMIN_EMAIL:}
app.auth.admin.password=${ADMIN_PASSWORD:}
account.reset.enabled=${ACCOUNT_RESET_ENABLED:false}
account.reset.email=${ACCOUNT_RESET_EMAIL:}
account.reset.password=${ACCOUNT_RESET_PASSWORD:}

# Session cookies are secure by default. Set SESSION_COOKIE_SECURE=false only for local HTTP development.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
