spring.application.name=student-management-system

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_management}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
spring.web.resources.static-locations=file:./frontend/,classpath:/static/
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://localhost}
